<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b9d"/>
      <stop offset="50%" style="stop-color:#c44eff"/>
      <stop offset="100%" style="stop-color:#4ecaff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- 오로라 효과 -->
  <ellipse cx="200" cy="100" rx="300" ry="200" fill="#ff6b9d" opacity="0.15"/>
  <ellipse cx="1000" cy="530" rx="400" ry="250" fill="#c44eff" opacity="0.12"/>
  <ellipse cx="600" cy="500" rx="350" ry="200" fill="#4ecaff" opacity="0.1"/>

  <!-- 별들 -->
  <circle cx="100" cy="150" r="3" fill="white" opacity="0.8"/>
  <circle cx="250" cy="80" r="2" fill="#ff6b9d" opacity="0.7"/>
  <circle cx="900" cy="120" r="3" fill="white" opacity="0.6"/>
  <circle cx="1050" cy="200" r="2" fill="#c44eff" opacity="0.8"/>
  <circle cx="150" cy="400" r="2" fill="#4ecaff" opacity="0.7"/>
  <circle cx="1100" cy="450" r="3" fill="white" opacity="0.5"/>
  <circle cx="50" cy="550" r="2" fill="#ff6b9d" opacity="0.6"/>

  <!-- 큰 별 -->
  <polygon points="180,250 186,270 206,270 190,282 196,302 180,290 164,302 170,282 154,270 174,270"
           fill="white" filter="url(#glow)" opacity="0.9"/>
  <polygon points="1020,350 1024,365 1039,365 1027,374 1031,389 1020,380 1009,389 1013,374 1001,365 1016,365"
           fill="white" filter="url(#glow)" opacity="0.8"/>

  <!-- 달 -->
  <path d="M1050 150 Q1100 180 1100 250 Q1100 320 1050 350 Q1080 320 1080 250 Q1080 180 1050 150"
        fill="#fff8e1" filter="url(#glow)" opacity="0.7"/>

  <!-- 로고 아이콘 -->
  <g transform="translate(300, 200)">
    <circle cx="60" cy="60" r="55" fill="url(#textGradient)" opacity="0.9"/>
    <path d="M65 25 Q85 40 85 65 Q85 90 65 105 Q78 90 78 65 Q78 40 65 25"
          fill="#fff8e1" filter="url(#glow)" opacity="0.95"/>
    <polygon points="40,35 44,48 57,48 47,57 51,70 40,61 29,70 33,57 23,48 36,48"
             fill="white" filter="url(#glow)"/>
    <polygon points="25,80 28,87 35,87 30,92 33,99 25,94 17,99 20,92 15,87 22,87"
             fill="white" opacity="0.8"/>
  </g>

  <!-- 메인 타이틀 -->
  <text x="420" y="260" font-family="system-ui, -apple-system, sans-serif"
        font-size="80" font-weight="700" fill="url(#textGradient)" filter="url(#glow)">
    LUMI
  </text>

  <!-- 서브 타이틀 -->
  <text x="420" y="330" font-family="system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="400" fill="white" opacity="0.9">
    버추얼 아이돌 AI 에이전트
  </text>

  <!-- 기능 태그들 -->
  <g transform="translate(420, 380)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-size="16"
          fill="white" text-anchor="middle">대화</text>

    <rect x="115" y="0" width="120" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="175" y="24" font-family="system-ui, sans-serif" font-size="16"
          fill="white" text-anchor="middle">스케줄 확인</text>

    <rect x="250" y="0" width="100" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="300" y="24" font-family="system-ui, sans-serif" font-size="16"
          fill="white" text-anchor="middle">팬레터</text>

    <rect x="365" y="0" width="120" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="425" y="24" font-family="system-ui, sans-serif" font-size="16"
          fill="white" text-anchor="middle">노래 추천</text>
  </g>

  <!-- 하단 기술 스택 -->
  <text x="600" y="560" font-family="monospace" font-size="14"
        fill="white" opacity="0.5" text-anchor="middle">
    LangGraph + Upstage Solar + FastAPI
  </text>
</svg>
