# 5강: Docker Compose 설정
# 로컬 개발 및 Production 배포용 컨테이너 설정
#
# 사용법:
#   # 로컬 개발 (빌드 + 실행)
#   docker-compose up --build
#
#   # Production (GHCR 이미지 사용)
#   LUMI_IMAGE=ghcr.io/owner/repo:tag docker-compose up -d
#
#   # 백그라운드 실행
#   docker-compose up -d
#
#   # 로그 확인
#   docker-compose logs -f
#
#   # 종료
#   docker-compose down
#
# 서비스 구성:
#   - lumi-agent: FastAPI 에이전트 서버 (메인)
#   - (Supabase는 클라우드 서비스 사용)
#   - (Redis는 6강에서 추가 예정)

services:
  # =============================================================
  # 메인 에이전트 서비스
  # =============================================================
  lumi-agent:
    # TODO 1: 이미지 및 빌드 설정, 사용할 docker 이미지 이름, LUMI_IMAGE 환경변수가 있으면 그걸 쓰고,
    # 없으면 -lumi-agent:latest를 쓴다
    image: ${LIMI_IMAGE:-lumi-agent:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lumi-agent
    # TODO 2: 포트 매핑 (호스트포트:컨테이너포트)
    ports:
      - "8000:8000"

    # TODO 3: 환경변수 설정
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-Production}
      - UPSTAGE_API_KEY=${UPSTAGE_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - DEBUG=false
      - USE_LITELLM=${USE_LITELLM:-true}
      # 개발환경에서는 DEBUG=true로 설정
      # 프로덕션 환경에서는 DEBUG=false로 설정
            # ===== LLMOps 2강: 체크포인터 =====
      - ENABLE_CHECKPOINTER=${ENABLE_CHECKPOINTER:-true}
      - CHECKPOINTER_TYPE=${CHECKPOINTER_TYPE:-postgres}
      # ===== LLMOps 2강: 비용 관리 =====
      - ENABLE_COST_TRACKING=${ENABLE_COST_TRACKING:-true}
      - DAILY_COST_LIMIT=${DAILY_COST_LIMIT:-10.0}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-3000}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      # ===== LLMOps 3강 : Lanfuse =====
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}


    # TODO 4: 헬스체크 및 재시작 정책 설정
    # dockerfile에 정의된 것 사용
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # 컨테이너 재시작 정책
    # 비정상 종료 시 자동 재시작
      # no :재시작 안 함
      # always : 항상 재시작
      # on-failure : 실패 시 재시작
      # unless-stopped : 멈추지 않는 한 재시작
    restart: unless-stopped
